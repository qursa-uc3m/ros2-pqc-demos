name: ros2-pqc-demos

x-common: &common
  working_dir: /workspace
  volumes:
    - shared-certs:/workspace/certs
  networks:
    - pqc-network
  init: true

services:
  base:
    build:
      context: .
      dockerfile: docker/Dockerfile.base
      args:
        ROS_DISTRO: ${ROS_DISTRO:-lyrical}
    image: ros2-pqc-demos:base

  dds-pqc:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.dds-pqc
      args:
        KEM_ALGORITHM: ${KEM_ALGORITHM:-mlkem768}
        PQSEC_DDS_COMMIT: ${PQSEC_DDS_COMMIT:-abf753f87f35fda09b29549eff17aba655ab06b2}
    image: ros2-pqc-demos:dds-pqc
    command: sleep infinity

  zenoh-pqc:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.zenoh-pqc
    image: ros2-pqc-demos:zenoh-pqc
    command: sleep infinity

  openssl4-cms:
    build:
      context: .
      dockerfile: docker/Dockerfile.openssl4-cms
      args:
        OPENSSL_TAG: ${OPENSSL_TAG:-openssl-4.0.1}
    image: ros2-pqc-demos:openssl4-cms

  artifacts-dds:
    <<: *common
    image: ros2-pqc-demos:base
    environment:
      ARTIFACT_MODE: dds
      IDENTITY_ALGORITHM: ${IDENTITY_ALGORITHM:-ML-DSA-44}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command: /workspace/scripts/certificates/generate_artifacts.sh

  artifacts-zenoh:
    <<: *common
    image: ros2-pqc-demos:zenoh-pqc
    environment:
      ARTIFACT_MODE: zenoh
      IDENTITY_ALGORITHM: ${IDENTITY_ALGORITHM:-ML-DSA-44}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command: /workspace/scripts/certificates/generate_artifacts.sh

  dds-talker:
    <<: *common
    image: ros2-pqc-demos:dds-pqc
    environment:
      NODE_ROLE: talker
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command: sleep infinity

  dds-listener:
    <<: *common
    image: ros2-pqc-demos:dds-pqc
    environment:
      NODE_ROLE: listener
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command: sleep infinity

  zenoh-router:
    <<: *common
    image: ros2-pqc-demos:zenoh-pqc
    hostname: zenoh-router
    environment:
      NODE_ROLE: router
      RUST_LOG: ${RUST_LOG:-info}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command:
      - bash
      - -lc
      - source /workspace/scripts/setup/setup_zenoh_env.sh && exec ros2 run rmw_zenoh_cpp rmw_zenohd

  zenoh-talker:
    <<: *common
    image: ros2-pqc-demos:zenoh-pqc
    environment:
      NODE_ROLE: talker
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command: sleep infinity

  zenoh-listener:
    <<: *common
    image: ros2-pqc-demos:zenoh-pqc
    environment:
      NODE_ROLE: listener
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command: sleep infinity

networks:
  pqc-network:
    driver: bridge

volumes:
  shared-certs:
